version: '3.8'

services:
  app:
    container_name: app
    # image: front42/nodejs2024q1-service-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_started
    networks:
      - library-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - ${PORT}:${PORT}
    volumes:
      - .:/app
      - /app/node_modules
      # - ./src:/app/src
  postgres:
    container_name: postgres
    # image: front42/nodejs2024q1-service-postgres
    build:
      context: ./src/database-prisma
      dockerfile: Dockerfile
    networks:
      - library-network
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_PORT=${DB_PORT}
      # - PG_DATA: /var/lib/postgresql/data/
    ports:
      - ${DB_PORT}:${DB_PORT}
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data/
      # - ./postgresql-data-volume/:/var/lib/postgresql/data/
volumes:
  pgdata:
networks:
  library-network:
    driver: bridge
